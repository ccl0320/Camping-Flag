<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>露營足跡 · Camping Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style id="app-style">
:root{
  --paper:#F4EFE7; --card:#FBF8F3; --ink:#3F3A33; --muted:#8A8174; --line:#E5DDD0; --soft:#EFE8DC;
  --sea:#C9D6D6; --land:#EDE6D6; --forest:#5E7149; --forest-d:#4A5B39; --terra:#BF673E; --terra-d:#A5552F; --terra-l:#F4E3D8;
  --sand:#E9E1D2; --danger:#B4452F;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
  --shadow:0 6px 20px rgba(70,55,35,.07),0 1px 2px rgba(70,55,35,.05);
  /* legacy aliases used in markup */
  --coral:var(--terra); --coral-l:var(--terra-l); --sun:#D9B26A; --leaf:#8FA36F; --leaf-d:var(--forest);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;background:var(--paper)}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 48px}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;height:250px;background:#E7DCCB;box-shadow:var(--shadow)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .ttl{position:absolute;left:34px;top:34px}
.hero .ttl .mt{width:52px;height:20px;display:block;margin-bottom:10px}
.hero h1{font-family:var(--serif);font-weight:700;font-size:40px;letter-spacing:.12em;margin:0;color:#3A332B;line-height:1.15}
.hero p{font-family:var(--serif);margin:4px 0 0;color:#5F564A;font-size:15px;letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:-46px 24px 18px;position:relative;z-index:2;max-width:560px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14.5px;letter-spacing:.06em;transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(70,55,35,.12)}
.tile svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile small{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.tile small a{color:var(--muted);text-decoration:underline;cursor:pointer}
.tile.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.tile.primary:hover{background:var(--terra-d)}
/* generic buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:999px;transition:background .12s,border-color .12s}
.btn:hover{border-color:#CFC4B2;background:#fff}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.primary:hover{background:var(--terra-d)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 14px;font-size:13px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px}
.stat .ic{width:40px;height:40px;flex:none;color:var(--forest);display:grid;place-items:center}
.stat .ic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.stat .v small{font-size:14px;color:var(--ink);font-weight:500;margin-left:4px}
.stat .l{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
/* next */
.next{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px 12px 12px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer}
.next .thumb{width:118px;height:92px;border-radius:12px;overflow:hidden;flex:none}
.next .thumb svg{width:100%;height:100%;display:block}
.next .cd{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--terra);line-height:1.1}
.next .cd small{font-size:16px;margin-left:2px}
.next .lbl{font-size:12.5px;color:var(--muted)}
.next .nm{font-family:var(--serif);font-weight:700;font-size:19px;margin:2px 0}
.next .more{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.next .chev{margin-left:auto;color:var(--muted);font-size:22px}
.years{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 16px;font-size:13.5px;color:var(--ink)}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.tag{display:inline-block;font-size:11.5px;border:1px solid #D9CFC0;border-radius:999px;padding:0 9px;margin-right:6px;background:var(--sand);vertical-align:1px;font-weight:400;color:#5F564A}
.tag.terra{border-color:#E2B9A3;background:transparent;color:var(--terra)}
.tag.late{background:var(--terra-l);border-color:#E2B9A3;color:var(--terra)}
/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.mapcard{background:var(--sea);border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.mapcard.has3d{background:radial-gradient(120% 90% at 60% 40%,#D5DFDD 0%,#BCCBCB 70%,#AEC0C1 100%)}
.mapcard svg#map{display:block;width:100%;height:auto;max-height:calc(100vh - 110px)}
.county{fill:var(--land);stroke:#9C927F;stroke-width:.8;stroke-linejoin:round;transition:fill .2s}
.county:hover{filter:brightness(.97)}
.coast{fill:none;stroke:#E8EEEC;stroke-width:6;opacity:.7;stroke-linejoin:round}
.picking .county{cursor:crosshair}
.inset-frame{fill:rgba(255,255,255,.25);stroke:#8E8677;stroke-width:1;stroke-dasharray:4 4}
.inset-label{font-size:12px;fill:var(--ink);font-family:var(--serif)}
.deco{pointer-events:none}
.pin{cursor:pointer}
.pin .tent{fill:var(--terra);stroke:#6D4A35;stroke-width:1.2;stroke-linejoin:round}
.pin.zero .tent{fill:#FBF8F3}
.pin.plan .tent{fill:#FBF8F3;stroke:var(--terra);stroke-dasharray:3 2;stroke-width:1.5}
.pin.sel .tent{fill:var(--forest)}
.pin .cnt{fill:#fff;stroke:#6D4A35;stroke-width:1}
.pin .pb{fill:#E9D7A8;stroke:#6D4A35;stroke-width:1}
.pin text{fill:var(--ink);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.legend{position:absolute;right:14px;bottom:14px;background:rgba(251,248,243,.94);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;box-shadow:var(--shadow)}
.legend .sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin:0 3px 0 8px;vertical-align:-2px;border:1px solid #8E8677}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);font-size:12.5px;padding:4px 12px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .12s;box-shadow:var(--shadow);font-family:var(--serif)}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:13px;display:none;gap:10px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.banner button{background:var(--sand);border:0;border-radius:999px;padding:0 10px}
.picking .banner{display:flex}
#map{touch-action:none;cursor:grab;overflow:hidden}
#map.dragging{cursor:grabbing}
.county,.coast,.inset-frame{vector-effect:non-scaling-stroke}
.clabel{fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:0;transition:opacity .2s;paint-order:stroke;stroke:#F4EFE7;stroke-width:3px;stroke-linejoin:round;font-family:var(--serif)}
#map.zl .clabel{opacity:.85}
.zoomctl{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.zoomctl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(251,248,243,.95);font-size:18px;line-height:1;padding:0;box-shadow:var(--shadow);color:var(--ink)}
.zoomhint{position:absolute;left:62px;bottom:20px;font-size:11.5px;color:var(--muted);background:rgba(251,248,243,.85);border-radius:999px;padding:2px 10px}
.mapcard.has3d #map{position:absolute;left:0;top:0;width:100%;visibility:hidden;pointer-events:none}
#gl{width:100%;aspect-ratio:620/820;max-height:calc(100vh - 110px);min-height:420px}
#gl canvas{display:block;outline:none}
/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 110px);min-height:420px;box-shadow:var(--shadow)}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;padding:13px 6px 11px;color:var(--muted);border-bottom:2px solid transparent;letter-spacing:.06em}
.tabs button.on{color:var(--ink);border-bottom-color:var(--terra);font-weight:500}
.pbody{overflow:auto;padding:4px 0;flex:1}
.empty{padding:34px 24px 40px;text-align:center;color:var(--muted)}
.empty svg{width:150px;height:110px;display:block;margin:0 auto 8px}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:4px}
.trip{display:grid;grid-template-columns:54px 1fr auto;gap:14px;padding:12px 18px;border-bottom:1px solid var(--soft);cursor:pointer;align-items:center}
.trip:hover{background:#F7F2EA}
.trip .n{width:52px;height:52px;border-radius:50%;border:1px solid #D8CDBC;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--serif)}
.trip .n .k{font-size:9px;color:var(--muted)}
.trip .n .num{font-size:19px;font-weight:600;margin:1px 0;color:var(--ink)}
.trip.planned .n{border-style:dashed;border-color:var(--terra)}
.trip.planned .n .num{font-size:16px;color:var(--terra)}
.trip .t{font-family:var(--serif);font-weight:600;font-size:15.5px}
.trip .m{font-size:12.5px;color:var(--muted)}
.stars{color:#C9A35A;font-size:13px;letter-spacing:1px}
.yearhead{padding:10px 18px 4px;font-family:var(--serif);font-size:13px;color:var(--muted);letter-spacing:.2em;background:var(--card);position:sticky;top:-4px;z-index:1}
.yearhead span{border-bottom:1px solid var(--terra);padding-bottom:1px}
.site{padding:12px 18px;border-bottom:1px solid var(--soft);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.site:hover{background:#F7F2EA}
.site .t{font-family:var(--serif)}
.badge{background:var(--sand);font-weight:500;border-radius:999px;padding:0 10px;font-size:12px;white-space:nowrap}
.cbar{padding:7px 18px;display:grid;grid-template-columns:72px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.cbar .bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.cbar .bar i{display:block;height:100%;background:var(--forest)}
.cbar.none{color:#BDB3A5}
.detail{padding:18px 20px 8px}
.detail h2{font-family:var(--serif);margin:6px 0 2px;font-size:24px;font-weight:700}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:13px}
.kv{color:var(--muted);font-size:13px;margin-bottom:10px}
.kv a{color:var(--forest)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.note{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13.5px;margin-top:8px;color:#5F564A}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(50,42,33,.35);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:22px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(50,42,33,.25)}
.modal h3{font-family:var(--serif);margin:0 0 16px;font-size:21px;font-weight:700}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(94,113,73,.15)}
.f textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.newsite{border:1px dashed #B9C2A6;border-radius:14px;padding:12px;margin-bottom:12px;background:#F2F3EA}
.hint{font-size:12px;color:var(--muted)}
.rate button{background:none;border:0;font-size:24px;color:#E1D8C9;padding:0 2px}
.rate button.on{color:#C9A35A}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;padding:8px}
.seg button.on{background:var(--forest);color:#fff}
.mfoot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.status{font-size:12px;color:var(--muted);margin-top:12px;text-align:right}
.status.warn{color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--forest);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin:14px 0}
.welcome h3{font-family:var(--serif);margin:0 0 4px;font-size:18px;color:var(--forest)}
.welcome p{margin:0;font-size:13.5px;color:var(--muted);max-width:520px;line-height:1.6}
.welcome .row{margin:0}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.viewbar{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:9px 14px;margin:14px 0;font-size:14px}
.viewbar a{margin-left:10px;color:var(--terra);text-decoration:underline}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:auto}
/* calendar */
.cal{padding:12px 16px 16px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b{font-family:var(--serif);font-size:18px;flex:1;text-align:center;font-weight:600}
.calhead button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:32px;height:30px;padding:0 10px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cgrid .wd{background:var(--soft);text-align:center;font-size:12px;padding:4px 0;color:var(--muted)}
.cgrid .wd.we{color:var(--terra)}
.cday{min-height:64px;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:3px 4px 4px;cursor:pointer;position:relative;overflow:hidden;background:var(--card)}
.cday:nth-child(7n){border-right:0}
.cday:hover{background:#F7F2EA}
.cday.out{background:#F6F2EB;color:#C9BFB0}
.cday.we .dn{color:var(--terra)}
.cday .dn{font-size:12px;display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-family:var(--serif)}
.cday.today .dn{background:var(--terra);color:#fff}
.cday.sel{background:#F1ECE1}
.ev{display:block;font-size:10.5px;line-height:16px;height:16px;margin:1px -4px 0;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#DCE3CF;color:#3E4A2F}
.ev.s{margin-left:1px;border-radius:8px 0 0 8px}
.ev.e{margin-right:1px;border-radius:0 8px 8px 0}
.ev.plan{background:var(--terra-l);color:var(--terra-d)}
.calkey{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px}
.calkey i{display:inline-block;width:18px;height:10px;border-radius:5px;vertical-align:-1px;margin-right:4px;background:#DCE3CF}
.calkey i.p{background:var(--terra-l)}
.upbox{border:1px solid var(--line);border-radius:16px;background:#F7F3EC;padding:10px 14px;margin-bottom:12px}
.upbox h4{margin:0 0 6px;font-size:14px;font-family:var(--serif)}
.upbox h4 small{font-weight:400;color:var(--muted);margin-left:6px;font-family:var(--sans)}
.up{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.up:first-of-type{border-top:0}
.up .d{min-width:90px;font-family:var(--serif);font-weight:600}
.up .c{margin-left:auto;font-size:12px;color:var(--terra);white-space:nowrap}
.daybox{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:#FBF8F3}
.daybox h4{margin:0 0 6px;font-size:14px;font-family:var(--serif)}
@media (max-width:860px){
  .wrap{padding:12px 12px 40px}
  .hero{height:230px}
  .hero h1{font-size:32px}
  .tiles{margin:-40px 10px 16px;max-width:none}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .panel{max-height:none}
  .mapcard svg#map{max-height:none}
  .next .thumb{width:96px;height:84px}
  .next .more{display:none}
  .tabs button{font-size:13px;padding:12px 2px 10px;letter-spacing:0;white-space:nowrap}
  .panel{max-height:75vh}
  .stat{padding:12px 14px;gap:10px}
  .stat .ic svg{width:28px;height:28px}
}
</style>
</head>

/* ---------- Supabase：帳號與個人紀錄 ---------- */
const SUPA_DEFAULT = { url: 'https://vpvftdwnkxocfqfunmrt.supabase.co', key: 'sb_publishable_18FlVXd-olquZKSI1G2bCw_wJQAEn_t' };
const SUPA_TABLE = 'camping_logs';
const DEMO_UID = '7d9bcb89-db90-48e2-ab8a-546eb3297d9b';   // Jerry 的公開範例
const AUTH_KEY = 'camping-supa-auth';
const EMPTY = () => ({version:1, sites:[], trips:[]});
const sb = { client:null, session:null, uid:null, ready:false, err:'', cfg:null, loading:false, booted:false };
const view = { mode:'local', uid:null, name:'', isPublic:false, missing:false };   // local | guest | own | public
function supaCfg(){ return SUPA_DEFAULT.url && SUPA_DEFAULT.key ? SUPA_DEFAULT : null; }
function loadSupaLib(){ return new Promise((ok, bad) => { if(window.supabase && window.supabase.createClient) return ok(); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = ok; s.onerror = () => bad(new Error('無法載入 Supabase 套件')); document.head.appendChild(s); }); }

function queryUid(){ const u = new URLSearchParams(location.search).get('u'); return u && /^[0-9a-f-]{36}$/i.test(u) ? u : null; }

function pickView(uid){

    const { data } = await sb.client.auth.getSession();
    sb.session = data.session; sb.uid = data.session && data.session.user ? data.session.user.id : null;
    sb.client.auth.onAuthStateChange((ev, s) => {
      const prev = sb.uid; sb.session = s; sb.uid = s && s.user ? s.user.id : null;
      if(ev === 'PASSWORD_RECOVERY') setTimeout(openNewPassword, 0);

      renderCloudBadge();

  }catch(e){ sb.err = e.message || String(e); renderCloudBadge(); }
}
async function enterMode(){
  const v = pickView(sb.uid);
  if(v.mode !== view.mode || v.uid !== view.uid){ applyView(v); render(); }
  if(view.mode !== 'guest') await cloudPull(true);
  renderCloudBadge();
}
async function cloudPull(first){
  if(!sb.ready || sb.loading || view.mode === 'guest' || view.mode === 'local') return;
  sb.loading = true; const target = view.uid;
  try{
    const { data, error } = await sb.client.from(SUPA_TABLE).select('data,updated_at,display_name,is_public').eq('user_id', target).maybeSingle();
    if(error) throw error;
    if(target !== view.uid) return;   // 讀取途中切換了帳號
    if(data){
      view.name = data.display_name || ''; view.isPublic = !!data.is_public; view.missing = false;
      if(data.data && Array.isArray(data.data.trips) && JSON.stringify(data.data) !== JSON.stringify(S)){ S = data.data; lsSet(); }
      sb.updated = data.updated_at; sb.err = '';
    } else if(view.mode === 'own' && first){
      await createOwnRow();
    } else if(view.mode === 'public'){
      view.missing = true; S = EMPTY();
    }
  }catch(e){ sb.err = '讀取雲端失敗：' + (e.message||e); }
  finally{ sb.loading = false; }
  if(!document.querySelector('.modal-bg.show')) render(); else renderCloudBadge();
}
async function createOwnRow(){
  const u = sb.session.user, meta = u.user_metadata || {};
  const guest = lsGet('guest');
  const fromGuest = !hasData(S) && hasData(guest);
  if(fromGuest) S = guest;
  const name = (meta.display_name || (u.email||'').split('@')[0] || '').slice(0, 40);
  const { error } = await sb.client.from(SUPA_TABLE).insert({ user_id: u.id, display_name: name, data: S });
  if(error){ sb.err = '建立個人紀錄失敗：' + error.message; return; }
  view.name = name; lsSet();
  if(fromGuest){ try{ localStorage.removeItem(lsKey('guest')); }catch(e){} setStatus(`已把試用時的 ${S.trips.length} 筆紀錄帶進你的帳號 ☁️`); }
}
async function cloudPush(){
  if(!sb.ready || view.mode !== 'own') return false;
  const { error } = await sb.client.from(SUPA_TABLE).update({ data: S, updated_at: new Date().toISOString() }).eq('user_id', sb.uid);
  if(error){ sb.err = '雲端儲存失敗：' + error.message; setStatus(sb.err, true); renderCloudBadge(); return false; }
  sb.err = ''; sb.updated = new Date().toISOString(); setStatus('已同步到雲端 ☁️'); renderCloudBadge(); return true;
}
async function saveProfile(patch){
  const { error } = await sb.client.from(SUPA_TABLE).update(patch).eq('user_id', sb.uid);
  if(error) return error.message;

}
function shareURL(uid){ return location.origin + location.pathname + '?u=' + uid; }
function cloudLabel(){

}
function renderCloudBadge(){ const b = document.getElementById('cloudLbl'); if(b) b.textContent = cloudLabel().replace(/^[^\s]+\s/,''); }
function openCloud(){ if(sb.ready && sb.session) openAccount(); else openAuth('login'); }
function openAuth(tab){
  if(!sb.ready){ return modal(`<h3>帳號</h3><div class="note" style="margin:0 0 12px">${sb.err ? '⚠️ '+esc(sb.err) : '正在連線雲端，請稍候再試。'}</div><div class="mfoot"><span></span><button class="btn" id="aClose">關閉</button></div>`).querySelector('#aClose').onclick = closeModal; }
  const T = { login:'登入', signup:'註冊', reset:'忘記密碼' };
  const box = modal(`<h3>${tab==='signup' ? '建立你的露營帳號' : tab==='reset' ? '重設密碼' : '歡迎回來'}</h3>
    <div class="f"><div class="seg">${Object.keys(T).map(k => `<button type="button" data-tab="${k}" class="${k===tab?'on':''}">${T[k]}</button>`).join('')}</div></div>
    ${tab==='signup' ? `<div class="f"><label>暱稱（顯示在你的足跡標題）</label><input id="aName" maxlength="40" placeholder="例如：小明"></div>` : ''}
    <div class="f"><label>Email</label><input id="aEmail" type="email" autocomplete="username" inputmode="email"></div>
    ${tab==='reset' ? '' : `<div class="f"><label>密碼${tab==='signup' ? '（至少 6 碼）' : ''}</label><input id="aPw" type="password" autocomplete="${tab==='signup'?'new-password':'current-password'}"></div>`}
    ${tab==='signup' && hasData(lsGet('guest')) ? `<div class="note" style="margin:0 0 10px">這台裝置上有 ${lsGet('guest').trips.length} 筆試用紀錄，註冊後會自動帶進你的帳號。</div>` : ''}
    <div class="err" id="aErr"></div><div class="note" id="aOk" style="display:none;margin:0 0 8px"></div>
    <div class="mfoot"><button class="btn" id="aClose">取消</button><button class="btn primary" id="aGo">${tab==='reset' ? '寄送重設信' : T[tab]}</button></div>`);
  const $ = id => box.querySelector('#'+id); const err = m => $('aErr').textContent = m;
  const ok = m => { $('aOk').style.display = ''; $('aOk').textContent = m; err(''); };

      if(tab === 'login'){
        const { error } = await sb.client.auth.signInWithPassword({ email, password: pw });
        if(error) return err(/invalid/i.test(error.message) ? 'Email 或密碼不正確' : /confirm/i.test(error.message) ? '這個帳號還沒完成 Email 驗證，請先到信箱點確認連結' : '登入失敗：' + error.message);
        closeModal();
      } else if(tab === 'signup'){
        const name = ($('aName').value.trim() || email.split('@')[0]).slice(0, 40);
        const { data, error } = await sb.client.auth.signUp({ email, password: pw, options:{ data:{ display_name:name }, emailRedirectTo: location.origin + location.pathname } });
        if(error) return err(/registered|exists/i.test(error.message) ? '這個 Email 已經註冊過了，請直接登入' : '註冊失敗：' + error.message);
        if(data.session) closeModal();
        else if(data.user && Array.isArray(data.user.identities) && !data.user.identities.length) err('這個 Email 已經註冊過了，請直接登入');
        else ok(`確認信已寄到 ${email}，點信中的連結就完成註冊（記得看一下垃圾信匣）。`);
      } else {
        const { error } = await sb.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if(error) return err('寄送失敗：' + error.message);
        ok(`重設密碼的連結已寄到 ${email}。`);
      }

  };
  $('aGo').onclick = go;
  box.querySelectorAll('input').forEach(i => i.onkeydown = e => { if(e.key === 'Enter') go(); });

function openAccount(){

/* ---------- persistence ---------- */
let art = null, canPublish = false, readOnly = false, saveTimer = null;
let statusMsg = '', statusWarn = false;
const LS_KEY = 'camping-log-v2';
function curKey(){ return view.mode === 'own' ? view.uid : view.mode === 'public' ? null : 'guest'; }
function lsKey(k){ return LS_KEY + ':' + k; }
function lsGet(k){ k = k || curKey(); if(!k) return null; try{ return JSON.parse(localStorage.getItem(lsKey(k))||'null'); }catch(e){ return null; } }
function lsSet(){ const k = curKey(); if(!k) return; try{ localStorage.setItem(lsKey(k), JSON.stringify(S)); }catch(e){} }

function genDoc(){
  const style = document.getElementById('app-style').textContent;
  const geo = document.getElementById('geo').textContent;
  const app = document.getElementById('app').textContent;
  const st = JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>露營足跡 · Camping Log</title>\n'
   + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">\n'
   + '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>\n<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>\n'
   + '<style id="app-style">' + style + '<\/style>\n</head>\n<body>\n<div class="wrap" id="root"></div>\n'
   + '<script id="geo" type="application/json">' + geo + '<\/script>\n'
   + '<script id="state" type="application/json">' + st + '<\/script>\n'
   + '<script id="app">' + app + '<\/script>\n</body>\n</html>\n';
}
function save(){
  lsSet();
  if(readOnly) return;
  if(sb.ready && view.mode === 'own'){ clearTimeout(saveTimer); setStatus('同步中…'); saveTimer = setTimeout(cloudPush, 400); return; }
  if(sb.ready && view.mode === 'guest'){ setStatus('已暫存在這台裝置，註冊或登入後會帶進你的帳號'); return; }
  if(!canPublish){ setStatus(art===null ? '目前只存在這個瀏覽器（此檢視無法儲存到網站）' : '', true); return; }
  setStatus('儲存中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await art.publish(genDoc()); setStatus('已儲存'); }
    catch(e){
      const c = (e && (e.code||e.message)) || '';
      if(/not_granted|not_writer/.test(c)){ readOnly = true; canPublish = false; setStatus('你沒有這個頁面的編輯權限，變更沒有儲存', true); render(); }
      else if(/conflict/.test(c)){ setStatus('別處剛更新過，已載入最新版本'); }
      else setStatus('儲存失敗，請再試一次', true);
    }
  }, 350);
}
function setStatus(m, warn){ statusMsg = m||''; statusWarn = !!warn; const el = document.getElementById('status'); if(el){ el.textContent = statusMsg; el.className = 'status' + (statusWarn?' warn':''); } }

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const siteById = id => S.sites.find(s => s.id === id);
const isPlan = t => t.status==='planned';
const todayStr = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const daysTo = d => Math.round((new Date(d) - new Date(todayStr()))/864e5);
function sortedTrips(){ return S.trips.slice().sort((a,b) => (a.start||'').localeCompare(b.start||'') || (a.created||0)-(b.created||0)); }
function numbering(){ const m = {}; let cur = 0; sortedTrips().forEach(t => { if(t.skip){ m[t.id] = null; return; } cur = (t.n && +t.n > 0) ? +t.n : cur + 1; m[t.id] = cur; }); return m; }
const hasLoc = s => s && s.lat != null && s.lng != null && !isNaN(s.lat);
function nights(t){ if(!t.start||!t.end) return 1; const d = (new Date(t.end) - new Date(t.start))/864e5; return Math.max(1, Math.round(d)); }
const fmtD = d => d ? d.replace(/-/g,'/') : '';
function fmtRange(t){ if(!t.end || t.end===t.start) return fmtD(t.start); const [y1,m1]=t.start.split('-'); const [y2,m2,d2]=t.end.split('-'); return fmtD(t.start)+' – '+(y1===y2 ? (m1===m2? d2 : m2+'/'+d2) : fmtD(t.end)); }
const stars = r => r ? '★'.repeat(r) + '<span style="color:#F3E7D3">' + '★'.repeat(5-r) + '</span>' : '';
const yearOf = t => (t.start||'').slice(0,4);

/* ---------- projection ---------- */
const R = Math.PI/180;
function projWith(p, lng, lat){ return [p.tx + p.k*lng*R, p.ty - p.k*Math.log(Math.tan(Math.PI/4 + lat*R/2))]; }
function invWith(p, x, y){ return [ (x - p.tx)/p.k / R, (2*Math.atan(Math.exp((p.ty - y)/p.k)) - Math.PI/2) / R ]; }
function regionOf(lng, lat){
  if(lng>118 && lng<118.65 && lat>24.3 && lat<24.6) return 'W';
  if(lng>119.8 && lng<120.6 && lat>25.85 && lat<26.5) return 'Z';
  return 'main';
}
const project = (lng, lat) => projWith(GEO.proj[regionOf(lng,lat)], lng, lat);
function countyAt(lng, lat){
  const [x,y] = project(lng,lat);
  const paths = document.querySelectorAll('path.county');
  for(const p of paths){ try{ if(p.isPointInFill(new DOMPoint(x,y))) return p.dataset.name; }catch(e){ break; } }
  let best=null, bd=1e9; GEO.counties.forEach(c => { const d = (c.cx-x)**2 + (c.cy-y)**2; if(d<bd){bd=d;best=c.name;} });
  return bd < 900 ? best : '';
}

function filtered(){ const d = S.trips.filter(t=>!isPlan(t)); return ui.year==='all' ? d : d.filter(t => yearOf(t)===ui.year); }
function plans(){ return S.trips.filter(isPlan).sort((a,b)=>(a.start||'').localeCompare(b.start||'')); }

    const pins = S.sites.filter(s => hasLoc(s) && (ui.year==='all' || cnt[s.id] || pl[s.id])).map(s => { const [x,y] = project(s.lng, s.lat); const n = cnt[s.id]||0;
      return {id:s.id, x, y, n, plan:!!pl[s.id], sel:ui.siteSel===s.id, county:s.county, tip:`${s.name} · ${n} 露${pl[s.id]?' · 有計畫':''}`}; });

function nextHTML(){
  const up = plans().filter(t => (t.end||t.start) >= todayStr());
  if(!up.length) return '';
  const t = up[0], s = siteById(t.siteId) || {name:'?'}, d = daysTo(t.start);
  const cd = d>0 ? `${d}<small>天</small>` : (d===0 ? '今天！' : '露營中');
  return `<div class="next" data-site="${t.siteId}"><div class="thumb">${scene('n',1)}</div>
    <div><div class="lbl">${d>0?'距離下一露還有':'出發囉'}</div><div class="cd">${cd}</div><div class="nm">${esc(s.name)}</div><div><span class="tag">第 ${numbering()[t.id]} 露</span><span class="tag terra">${BOOK[t.book]||'計畫中'}</span></div><div class="lbl">${fmtRange(t)} · ${nights(t)} 晚${s.county?' · '+SHORT(s.county):''}</div></div>
    ${up.length>1?`<div class="more">還有 ${up.length-1} 個計畫 ›</div>`:'<div class="chev">›</div>'}</div>`;

function shade(c, max){
  if(!c) return 'var(--land)';
  const t = max<=1 ? 1 : (c-1)/(max-1);
  const a = [214,223,193], b = [110,139,85];
  return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;
}

function tentPin(s, x, y, n, planned){

  return `<g class="pin ${n?'':(planned?'plan':'zero')} ${ui.siteSel===s.id?'sel':''}" data-site="${s.id}" data-cs="p" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}" data-s="${sc}" transform="${csT(x,y,sc,'p')}">
    <ellipse cx="0" cy="0" rx="10" ry="2.8" fill="rgba(74,59,50,.22)"/>
    <path class="tent" d="M-10 0 L0 -18 L10 0Z"/><path d="M-3.6 0 L0 -7 L3.6 0Z" fill="#4A3B32"/>
    <path d="M0 -18 L0 -23 L6 -21 L0 -19.4" fill="#FFD166" stroke="#4A3B32" stroke-width="1.1" stroke-linejoin="round"/>

    <rect x="-12" y="-24" width="24" height="26" fill="transparent"/></g>`;

function mapSVG(countyCount, maxC, trips){
  const cnt = {}; trips.forEach(t => cnt[t.siteId] = (cnt[t.siteId]||0)+1);
  const pl = {}; plans().forEach(t => pl[t.siteId] = true);
  const sites = S.sites.filter(s => hasLoc(s) && (ui.year==='all' || cnt[s.id] || pl[s.id])).slice().sort((a,b)=>b.lat-a.lat);
  const ins = GEO.insets;
  const frame = (id,label) => { const [[x0,y0],[x1,y1]] = ins[id]; return `<rect class="inset-frame" x="${x0-8}" y="${y0-8}" width="${x1-x0+16}" height="${y1-y0+16}" rx="8"/><text class="inset-label" x="${x0-6}" y="${y0-13}">${label}</text>`; };
  const deco = decorations();
  const V0 = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H};
  return `<svg viewBox="${V0.x} ${V0.y} ${V0.w} ${V0.h}" id="map" class="${zoomNow()>=2.2?'zl':''}" role="img" aria-label="台灣露營地圖">
    <g class="deco">${deco.sea}</g>
    ${frame('Z','連江（馬祖）')}${frame('W','金門')}
    <g class="deco">${GEO.counties.map(c => `<path class="coast" d="${c.d}"/>`).join('')}</g>
    <g>${GEO.counties.map(c => `<path class="county" data-name="${c.name}" data-id="${c.id}" d="${c.d}" style="fill:${shade(countyCount[c.name]||0,maxC)}"><title>${c.name}${countyCount[c.name]?' · '+countyCount[c.name]+' 露':''}</title></path>`).join('')}</g>
    <g class="deco">${deco.land}</g>
    <g>${GEO.counties.map(c => `<text class="clabel" x="${c.cx}" y="${c.cy}" style="font-size:${(13/zoomNow()).toFixed(2)}px">${SHORT(c.name)}</text>`).join('')}</g>
    <g>${sites.map(s => { const [x,y] = project(s.lng,s.lat); return tentPin(s, x, y, cnt[s.id]||0, pl[s.id]); }).join('')}</g>
  </svg>`;
}

const addDays = (d,n) => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function tripsOn(d){ return S.trips.filter(t => t.start <= d && (t.end||t.start) >= d).sort((a,b)=>(a.start).localeCompare(b.start)); }
function calHTML(){
  const today = todayStr();
  const ym = ui.calMonth || today.slice(0,7); const [Y,M] = ym.split('-').map(Number);
  const first = ym+'-01', startDow = new Date(first+'T00:00:00').getDay();
  const gridStart = addDays(first, -startDow);
  const lastDay = new Date(Y, M, 0).getDate();
  const weeks = Math.ceil((startDow + lastDay)/7);
  const WD = ['日','一','二','三','四','五','六'];
  let cells = WD.map((w,i)=>`<div class="wd ${i===0||i===6?'we':''}">${w}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const d = addDays(gridStart, i), dow = i%7, out = d.slice(0,7)!==ym;
    const evs = tripsOn(d).map(t => { const s = siteById(t.siteId)||{name:'?'}; const st = d===t.start, en = d===(t.end||t.start);
      const label = (st || dow===0) ? esc(s.name) : '&nbsp;';
      return `<span class="ev ${isPlan(t)?'plan':''} ${st?'s':''} ${en?'e':''}" title="${esc(s.name)}">${label}</span>`; }).join('');
    cells += `<div class="cday ${out?'out':''} ${dow===0||dow===6?'we':''} ${d===today?'today':''} ${ui.calDay===d?'sel':''}" data-day="${d}"><span class="dn">${+d.slice(8)}</span>${evs}</div>`;
  }
  // upcoming
  const up = S.trips.filter(t => (t.end||t.start) >= today).sort((a,b)=>a.start.localeCompare(b.start));
  let campDays30 = 0; for(let i=0;i<30;i++) if(tripsOn(addDays(today,i)).length) campDays30++;
  const upHTML = `<div class="upbox"><h4>🗓️ 接下來的露營安排<small>${up.length ? `未來 30 天有 ${campDays30} 天在露營` : ''}</small></h4>
    ${up.length ? up.map(t => { const s = siteById(t.siteId)||{name:'?'}; const d = daysTo(t.start);
      return `<div class="up" data-trip="${t.id}"><span class="d">${t.start.slice(5).replace('-','/')}${t.end&&t.end!==t.start?' – '+t.end.slice(5).replace('-','/'):''}</span><span>${esc(s.name)}${isPlan(t)?`<span class="tag">${BOOK[t.book]||'計畫中'}</span>`:''}</span><span class="c">${d>0?'還有 '+d+' 天':'露營中 🔥'}</span></div>`; }).join('')
      : '<div class="hint">目前沒有排定的露營。點月曆上任一天就能加入計畫。</div>'}</div>`;
  let dayHTML = '';
  if(ui.calDay){
    const list = tripsOn(ui.calDay); const [, m, dd] = ui.calDay.split('-');
    dayHTML = `<div class="daybox"><h4>${+m}/${+dd}（${WD[new Date(ui.calDay+'T00:00:00').getDay()]}）</h4>
      ${list.length ? list.map(t => isPlan(t) ? planRow(t) : tripRow(t, numbering()).replace(/class="trip" data-site="[^"]*"/, `class="trip" data-trip="${t.id}"`)).join('') : '<div class="hint">這天沒有露營安排</div>'}
      ${readOnly?'':`<div class="row"><button class="btn sm primary" data-act="addday">＋ 從這天開始${ui.calDay > today ? '安排露營' : '新增一露'}</button></div>`}</div>`;
  }
  return `<div class="cal">${upHTML}
    <div class="calhead"><button data-cal="-1" aria-label="上個月">‹</button><b>${Y} 年 ${M} 月</b><button data-cal="1" aria-label="下個月">›</button><button data-cal="0">今天</button></div>
    <div class="cgrid">${cells}</div>
    <div class="calkey"><span><i></i>露過了</span><span><i class="p"></i>計畫中 / 已預訂</span></div>
    ${dayHTML}</div>`;
}
function planRow(t){
  const pn = numbering()[t.id];
  const s = siteById(t.siteId) || {name:'（已刪除的露營區）', county:''}; const d = daysTo(t.start); const late = (t.end||t.start) < todayStr();
  return `<div class="trip planned" data-trip="${t.id}">
    <div class="n"><span class="k">${late?'日期':'倒數'}</span><span class="num">${late?'已過':d<=0?'GO':d}</span><span class="k">${late||d<=0?'':'天'}</span></div>
    <div><div class="t">${esc(s.name)}<span class="tag terra">預計第 ${pn} 露</span><span class="tag ${late?'late':''}">${late?'待確認':(BOOK[t.book]||'計畫中')}</span></div><div class="m">${fmtRange(t)} · ${nights(t)} 晚${s.county?' · '+SHORT(s.county):''}${t.people?' · '+esc(t.people):''}</div>
    ${late && !readOnly?`<div class="row" style="margin:6px 0 0"><button class="btn sm" data-done="${t.id}">✅ 標記為露過了</button></div>`:''}</div><div></div></div>`;
}
function tripRow(t, num){
  const s = siteById(t.siteId) || {name:'（已刪除的露營區）', county:''};
  const nn = num[t.id];
  return `<div class="trip" data-site="${t.siteId}">
    <div class="n">${nn==null ? '<span class="k">不計</span><span class="num" style="font-size:15px">—</span><span class="k">露數</span>' : `<span class="k">第</span><span class="num">${nn}</span><span class="k">露</span>`}</div>
    <div><div class="t">${esc(s.name)}</div><div class="m">${fmtRange(t)} · ${nights(t)} 晚${s.county?' · '+SHORT(s.county):''}${t.people?' · '+esc(t.people):''}</div></div>
    <div class="stars">${stars(t.rating)}</div></div>`;
}

function panelHTML(trips, num, countyCount, maxC){
  if(ui.siteSel && siteById(ui.siteSel)) return detailHTML(siteById(ui.siteSel), num);
  const tabs = `<div class="tabs">${[['timeline','時間軸'],['cal','月曆'],['plans','計畫中'+(plans().length?' '+plans().length:'')],['sites','露營區'],['counties','縣市']].map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if(ui.tab==='cal'){
    body = calHTML();
  } else if(ui.tab==='plans'){
    body = plans().map(planRow).join('') || `<div class="empty"><b>還沒有計畫</b>訂好營位了嗎？按「📅 加入計畫」先記下來，<br>這裡會幫你倒數出發日。</div>`;
  } else if(!S.trips.filter(t=>!isPlan(t)).length){
    body = `<div class="empty">${EMPTY_ART}<b>還沒有露營紀錄</b>按「＋ 新增一露」記下第一露，<br>地圖上就會搭起第一頂小帳篷 ⛺</div>`;
  } else if(ui.tab==='timeline'){
    const list = trips.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||'')); let lastY = null;
    body = list.map(t => { const y = yearOf(t); const h = y!==lastY ? `<div class="yearhead"><span>${y}</span></div>` : ''; lastY = y; return h + tripRow(t,num); }).join('') || '<div class="empty">這一年沒有紀錄</div>';
  } else if(ui.tab==='sites'){
    const cnt = {}, last = {}; trips.forEach(t => { cnt[t.siteId]=(cnt[t.siteId]||0)+1; if(!last[t.siteId] || t.start>last[t.siteId]) last[t.siteId]=t.start; });
    const list = S.sites.filter(s => ui.year==='all' || cnt[s.id]).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0) || (last[b.id]||'').localeCompare(last[a.id]||''));
    body = list.map(s => `<div class="site" data-site="${s.id}"><div><div class="t" style="font-weight:700">${esc(s.name)}</div><div class="m hint">${hasLoc(s)?'':'📍待補位置 · '}${esc(s.county||'未指定縣市')}${last[s.id]?' · 最近 '+fmtD(last[s.id]):''}</div></div><span class="badge">${cnt[s.id]||0} 露</span></div>`).join('') || '<div class="empty">沒有露營區</div>';
  } else {
    body = COUNTY_ORDER.map(c => { const n = countyCount[c]||0; return `<div class="cbar ${n?'':'none'}"><span>${SHORT(c)}</span><span class="bar"><i style="width:${n? Math.max(6, n/maxC*100):0}%"></i></span><span style="text-align:right">${n||'—'}</span></div>`; }).join('');
  }
  return tabs + `<div class="pbody">${body}</div>`;
}

function detailHTML(s, num){
  const trips = S.trips.filter(t => t.siteId===s.id && !isPlan(t)).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  const pls = plans().filter(t => t.siteId===s.id);
  const maps = hasLoc(s) ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' 露營區')}`;
  return `<div class="pbody"><div class="detail">
    <button class="back" data-act="back">← 返回列表</button>
    <h2>${esc(s.name)}</h2>
    <div class="kv">${esc(s.county||'未指定縣市')} · 共 ${trips.length} 露${pls.length?' · '+pls.length+' 個計畫':''} · <a href="${maps}" target="_blank" rel="noopener">${hasLoc(s)?'在 Google 地圖開啟':'在 Google 地圖搜尋'}</a></div>
    ${hasLoc(s)?'':'<div class="note">📍 這個營地還沒有位置，按「編輯露營區」貼上座標，就會出現在地圖上。</div>'}
    ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
    ${readOnly?'':`<div class="row"><button class="btn primary sm" data-act="again">＋ 再露一次</button><button class="btn sm" data-act="editsite">編輯露營區</button><button class="btn sm danger" data-act="delsite">刪除露營區</button></div>`}
  </div>
  ${pls.map(planRow).join('')}
  ${trips.map(t => `<div class="trip" data-trip="${t.id}">
    <div class="n">${num[t.id]==null ? '<span class="k">不計</span><span class="num" style="font-size:15px">—</span><span class="k">露數</span>' : `<span class="k">第</span><span class="num">${num[t.id]}</span><span class="k">露</span>`}</div>
    <div><div class="t">${fmtRange(t)} · ${nights(t)} 晚</div><div class="m">${t.people?'同行：'+esc(t.people):''}</div>${t.note?`<div class="note">${esc(t.note)}</div>`:''}</div>
    <div class="stars">${stars(t.rating)}</div></div>`).join('')}
  </div>`;
}

  const W = GEO.W, H = GEO.H;
  const wx = x => x - W/2, wz = y => y - H/2;
  const rnd = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261119);
  const mat = (color, o) => new T.MeshStandardMaterial(Object.assign({color, flatShading:true, roughness:.85, metalness:0}, o||{}));
  const HOME = { pos:new T.Vector3(45, 900, 1080), tgt:new T.Vector3(45, 0, 75) };
  let inited = false, renderer, scene, camera, controls, ro, host, clock;

    if(picking){
      const hit = pick(e, Object.values(counties).map(c => c.mesh));
      if(hit && cb.pick) cb.pick(hit.point.x + W/2, hit.point.z + H/2, hit.object.userData.id, hit.object.userData.name);
      return;
    }
    const hit = pick(e, pins.map(p => p.hit));
    if(hit && cb.pin) cb.pin(hit.object.userData.site);
  }

  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2, 2)/2;
  function flyTo(pos, tgt, dur){ fly = {p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:tgt, s:performance.now(), d:dur||900}; }

  function loop(){
    const t = clock.getElapsedTime();
    if(fly){ const u = Math.min(1, (performance.now()-fly.s)/fly.d), k = ease(u); camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k); if(u>=1) fly = null; }
    controls.update();
    // ocean waves
    const pa = ocean.geometry.attributes.position, a = pa.array;
    for(let i=0; i<a.length; i+=3){ const x = oceanBase[i], z = oceanBase[i+2]; a[i+1] = Math.sin(x*.016 + t*.7)*.7 + Math.cos(z*.021 + t*.55)*.6; }
    pa.needsUpdate = true; ocean.geometry.computeVertexNormals();
    // heights
    for(const n in counties){ const c = counties[n]; if(Math.abs(c.target - c.h) > .01){ c.h += (c.target - c.h)*.08; c.mesh.scale.y = c.h; needDeco = true; } }
    if(needDeco){ layoutDeco(); needDeco = false; }
    clouds.forEach(g => { g.position.x += g.userData.v; if(g.position.x > 750) g.position.x = -750; });
    floaters.forEach(f => {
      if(f.type==='boat'){ f.o.position.y = Math.sin(t*1.6 + f.ph)*1.1; f.o.rotation.z = Math.sin(t*1.3 + f.ph)*.08; }
      else if(f.type==='whale'){ f.o.position.y = Math.sin(t*.9)*1.6 - 1; f.spout.visible = Math.sin(t*.7) > .2; f.spout.position.y = (t*6) % 4; }
      else if(f.type==='balloon'){ f.o.position.y = f.y0 + Math.sin(t*.6)*8; f.o.rotation.y = t*.15; }
    });
    const dist = camera.position.distanceTo(controls.target);
    const ps = Math.max(.42, Math.min(1.1, dist/800));
    pins.forEach(p => { const y = baseY(p.county); p.g.position.y = y; p.head.scale.setScalar(ps*p.sc); p.head.position.y = POLE + Math.sin(t*2 + p.ph)*(p.sel ? 2.2 : .7) + (p.sel ? 2 : 0); p.hit.scale.x = p.hit.scale.z = Math.max(1, ps*1.2); });
    const showLab = dist < 640, ls = Math.max(.35, Math.min(1.1, dist/520));
    labelSprites.forEach(l => { l.visible = l.userData.fixed ? true : showLab; const h = l.userData.h * (l.userData.fixed ? Math.max(.5, Math.min(1.4, dist/800)) : ls); l.scale.set(h*l.userData.ar, h, 1); });
    if(hoverId){ const p = pins.find(x => x.id===hoverId); if(p) tip(p); }
    renderer.render(scene, camera);
  }
  function resize(){ if(!host) return; const w = host.clientWidth, h = host.clientHeight; if(!w || !h) return; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }

  return {
    mount(el){ if(!inited) init(); host = el; el.appendChild(renderer.domElement); if(ro) ro.disconnect(); ro = new ResizeObserver(resize); ro.observe(el); resize(); },
    update(d){
      if(!inited) return;
      picking = !!d.picking; renderer.domElement.style.cursor = picking ? 'crosshair' : 'grab';
      const max = Math.max(1, d.maxC);
      for(const n in counties){ const c = counties[n], k = d.countyCount[n] || 0; c.target = hOf(k);
        if(k){ const u = max<=1 ? 1 : (k-1)/(max-1); c.top.color.setRGB((200+(105-200)*u)/255, (212+(132-212)*u)/255, (172+(80-172)*u)/255); c.side.color.setHex(0x8C9A72); }
        else { c.top.color.setHex(0xC4C3A9); c.side.color.setHex(0xAFA68A); } }
      setPins(d.pins); hoverId = null; tip(null);
    },
    focus(x, y){ const tg = new T.Vector3(wx(x), 0, wz(y)); const dir = camera.position.clone().sub(controls.target); const L = Math.min(dir.length(), 420); flyTo(tg.clone().add(dir.normalize().multiplyScalar(L)), tg); },
    zoom(f){ const dir = camera.position.clone().sub(controls.target); const L = Math.max(controls.minDistance, Math.min(controls.maxDistance, dir.length()/f)); flyTo(controls.target.clone().add(dir.normalize().multiplyScalar(L)), controls.target.clone(), 450); },
    reset(){ flyTo(HOME.pos.clone(), HOME.tgt.clone()); },
    on(name, fn){ cb[name] = fn; }
  };
})();

    card.querySelectorAll('[data-zoom]').forEach(b => b.onclick = e => { e.stopPropagation(); const k = b.dataset.zoom; if(k==='reset') M3.reset(); else M3.zoom(k==='in' ? 1.6 : 1/1.6); });

  }

    if(svg._dragged) return;
    if(!ui.picking) return;

    const p = pt.matrixTransform(svg.getScreenCTM().inverse());

/* ---------- zoom & pan ---------- */
function focusSite(id){
  const s = siteById(id); if(!hasLoc(s)) return;
  ui.focusReq = id;
  const [x,y] = project(s.lng, s.lat);
  const w = Math.min(ui.view ? ui.view.w : GEO.W, GEO.W/3), h = w*GEO.H/GEO.W;
  ui.view = clampView({x:x-w/2, y:y-h/2, w, h});
}
function clampView(V){
  const minW = GEO.W/8; if(V.w < minW){ const c=[V.x+V.w/2,V.y+V.h/2]; V.w=minW; V.h=minW*GEO.H/GEO.W; V.x=c[0]-V.w/2; V.y=c[1]-V.h/2; }
  if(V.w >= GEO.W) return {x:0,y:0,w:GEO.W,h:GEO.H};
  V.x = Math.max(-V.w*0.3, Math.min(GEO.W - V.w*0.7, V.x));
  V.y = Math.max(-V.h*0.3, Math.min(GEO.H - V.h*0.7, V.y));
  return V;
}
function setupZoom(svg, card){
  const apply = () => {
    const V = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H};
    svg.setAttribute('viewBox', `${V.x} ${V.y} ${V.w} ${V.h}`);
    const z = GEO.W/V.w;
    svg.querySelectorAll('[data-cs]').forEach(g => g.setAttribute('transform', csT(+g.dataset.x, +g.dataset.y, +g.dataset.s, g.dataset.cs)));
    const fs = (13/z).toFixed(2)+'px'; svg.querySelectorAll('.clabel').forEach(l => l.style.fontSize = fs);
    svg.classList.toggle('zl', z >= 2.2);
    const hint = document.getElementById('zoomhint'); if(hint) hint.textContent = z>1.05 ? `${z.toFixed(1)}×` : '滾輪 / 雙指縮放 · 拖曳移動';
    document.getElementById('tip').style.opacity = 0;
  };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), V = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H}; return [V.x + (cx-r.left)/r.width*V.w, V.y + (cy-r.top)/r.height*V.h]; };
  const zoomAt = (f, px, py) => {
    const V = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H};
    const nw = Math.max(GEO.W/8, Math.min(GEO.W, V.w/f)), nh = nw*GEO.H/GEO.W;
    ui.view = clampView({x: px - (px-V.x)*nw/V.w, y: py - (py-V.y)*nh/V.h, w:nw, h:nh}); apply();
  };
  const center = () => { const V = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H}; return [V.x+V.w/2, V.y+V.h/2]; };
  card.querySelectorAll('[data-zoom]').forEach(b => b.onclick = e => { e.stopPropagation(); const k = b.dataset.zoom;
    if(k==='reset'){ ui.view = null; apply(); } else { const [cx,cy] = center(); zoomAt(k==='in'?1.6:1/1.6, cx, cy); } });
  svg.addEventListener('wheel', e => { e.preventDefault(); const [x,y] = toSvg(e.clientX, e.clientY); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0012)), x, y); }, {passive:false});
  svg.addEventListener('dblclick', e => { e.preventDefault(); if(ui.picking) return; const [x,y] = toSvg(e.clientX, e.clientY); zoomAt(e.shiftKey?1/2:2, x, y); });
  const pts = new Map(); let start = null, pinch = null;
  svg.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]); svg._dragged = false;
    const V = ui.view || {x:0,y:0,w:GEO.W,h:GEO.H};
    start = {cx:e.clientX, cy:e.clientY, V:{...V}};
    if(pts.size===2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a[0]-b[0],a[1]-b[1]), V:{...V}, mid: toSvg((a[0]+b[0])/2,(a[1]+b[1])/2)}; }
  });
  svg.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect();
    if(pts.size===2 && pinch){
      const [a,b] = [...pts.values()]; const d = Math.hypot(a[0]-b[0],a[1]-b[1]); svg._dragged = true;
      const f = d/pinch.d, V = pinch.V, nw = Math.max(GEO.W/8, Math.min(GEO.W, V.w/f)), nh = nw*GEO.H/GEO.W;
      const mx = ((a[0]+b[0])/2 - r.left)/r.width, my = ((a[1]+b[1])/2 - r.top)/r.height;
      ui.view = clampView({x: pinch.mid[0] - mx*nw, y: pinch.mid[1] - my*nh, w:nw, h:nh}); apply(); return;
    }
    if(pts.size===1 && start){
      const dx = e.clientX-start.cx, dy = e.clientY-start.cy;
      if(!svg._dragged && Math.hypot(dx,dy) < 5) return;
      if(!svg._dragged){ svg._dragged = true; svg.classList.add('dragging'); try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
      if(start.V.w >= GEO.W) return;
      ui.view = clampView({x: start.V.x - dx/r.width*start.V.w, y: start.V.y - dy/r.height*start.V.h, w:start.V.w, h:start.V.h}); apply();
    }
  });
  const end = e => { pts.delete(e.pointerId); if(pts.size<2) pinch = null; if(!pts.size){ start = null; svg.classList.remove('dragging'); setTimeout(()=>{ svg._dragged = false; }, 0); } else { const [p] = [...pts.values()]; start = {cx:p[0], cy:p[1], V:{...(ui.view||{x:0,y:0,w:GEO.W,h:GEO.H})}}; } };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}

  box.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const r = +b.dataset.r; f.rating = f.rating===r ? 0 : r; box.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= f.rating)); });
  $('fCancel').onclick = closeModal;
  if($('fDel')) $('fDel').onclick = () => { const id = f.id; confirmBox(f.status==='planned' ? '確定刪除這個計畫？' : '確定刪除這一露？之後的露營編號會自動往前遞補。', '刪除', () => { S.trips = S.trips.filter(t => t.id!==id); render(); save(); }); };
  $('fSave').onclick = () => {
    sync(); const err = m => $('fErr').textContent = m;
    if(!f.siteId) return err('請選擇露營區');
    if(!f.start) return err('請填入營日');
    if(f.end && f.end < f.start) return err('拔營日不能早於入營日');
    let siteId = f.siteId;
    if(siteId==='__new'){
      if(!f.newName.trim()) return err('請輸入露營區名稱');
      const c = f.coords.trim() ? parseCoords(f.coords) : null; if(f.coords.trim() && !c) return err('座標格式不對，請貼上「緯度, 經度」或在地圖上點選');
      const county = f.county || (c ? countyAt(c.lng, c.lat) : '');
      const s = {id:uid(), name:f.newName.trim(), lat: c ? +c.lat.toFixed(5) : null, lng: c ? +c.lng.toFixed(5) : null, county, note:''};
      S.sites.push(s); siteId = s.id;
    }
    const data = {n: f.n ? +f.n : undefined, siteId, start:f.start, end:f.end||f.start, people:f.people.trim(), note:f.note.trim(), rating: f.status==='planned'?0:f.rating, status:f.status};
    if(f.status==='planned') data.book = f.book;
    if(f.skip) data.skip = true; if(!data.n) delete data.n;
    if(f.id){ const tr = S.trips.find(t=>t.id===f.id); if(f.status!=='planned') delete tr.book; if(!data.n) delete tr.n; if(!f.skip) delete tr.skip; Object.assign(tr, data); }
    else S.trips.push(Object.assign({id:uid(), created:Date.now()}, data));
    if(ui.tab==='cal'){ ui.siteSel=null; ui.calMonth = f.start.slice(0,7); } else if(f.status==='planned'){ ui.tab='plans'; ui.siteSel=null; } else ui.siteSel = siteId;
    closeModal(); render(); save();
  };
}

/* ---------- site form ---------- */
function openSiteForm(s){
  const box = modal(`<h3>編輯露營區</h3>
    <div class="f"><label>名稱</label><input id="sName" value="${esc(s.name)}"></div>
    <div class="f"><label>位置座標（緯度, 經度）</label><input id="sCoords" value="${hasLoc(s) ? s.lat+', '+s.lng : ''}" placeholder="24.12345, 121.23456（可留空）"></div>
    <div class="f"><label>縣市</label><select id="sCounty">${countyOptions(s.county)}</select></div>
    <div class="f"><label>露營區筆記（營主、電話、營位推薦…）</label><textarea id="sNote">${esc(s.note||'')}</textarea></div>
    <div class="err" id="sErr"></div>
    <div class="mfoot"><span></span><span class="row" style="margin:0"><button class="btn" id="sCancel">取消</button><button class="btn primary" id="sSave">儲存</button></span></div>`);
  const $ = id => box.querySelector('#'+id);
  $('sCancel').onclick = closeModal;
  $('sSave').onclick = () => {
    const raw = $('sCoords').value.trim(); const c = raw ? parseCoords(raw) : null; if(raw && !c) return $('sErr').textContent = '座標格式不對';
    if(!$('sName').value.trim()) return $('sErr').textContent = '請輸入名稱';
    const moved = c ? (c.lat!==s.lat || c.lng!==s.lng) : false;
    s.name = $('sName').value.trim(); s.note = $('sNote').value.trim();
    if(c){ s.lat = +c.lat.toFixed(5); s.lng = +c.lng.toFixed(5); } else { s.lat = null; s.lng = null; }
    s.county = $('sCounty').value || (c && (moved || !s.county) ? countyAt(s.lng, s.lat) : s.county);
    closeModal(); render(); save();
  };
}
function delSite(s){
  const n = S.trips.filter(t => t.siteId===s.id).length;
  confirmBox(n ? `「${esc(s.name)}」有 ${n} 筆紀錄（含計畫），刪除露營區會一併刪除這些紀錄。` : `確定刪除「${esc(s.name)}」？`, '刪除', () => {
    S.trips = S.trips.filter(t => t.siteId!==s.id); S.sites = S.sites.filter(x => x.id!==s.id); ui.siteSel = null; render(); save();
  });
}

/* ---------- backup ---------- */
function openBackup(){
  const json = JSON.stringify(S, null, 1);
  const box = modal(`<h3>備份 / 匯入</h3>
    <div class="f"><label>目前資料（JSON）</label><textarea id="bJson" style="min-height:160px;font-family:monospace;font-size:12px">${esc(json)}</textarea></div>
    <div class="row"><button class="btn sm" id="bCopy">複製</button>${readOnly?'':'<label class="btn sm" style="display:inline-block">選擇檔案匯入<input type="file" id="bFile" accept=".json,application/json" style="display:none"></label><button class="btn sm" id="bImport">用上方內容取代資料</button>'}</div>
    <div class="err" id="bErr"></div>
    <div class="mfoot"><span></span><button class="btn" id="bClose">關閉</button></div>`);
  const $ = id => box.querySelector('#'+id);
  $('bClose').onclick = closeModal;
  $('bCopy').onclick = async () => { try{ await navigator.clipboard.writeText(json); $('bCopy').textContent = '已複製'; }catch(e){ $('bJson').select(); $('bErr').textContent = '請手動複製（已全選）'; } };
  const apply = txt => { try{ const d = JSON.parse(txt); if(!Array.isArray(d.sites)||!Array.isArray(d.trips)) throw 0; confirmBox(`將以匯入資料取代目前紀錄（${d.trips.length} 露、${d.sites.length} 處露營區）。`, '取代', () => { S = {version:1, sites:d.sites, trips:d.trips}; ui.siteSel=null; render(); save(); }); }catch(e){ $('bErr').textContent = '格式不正確，需包含 sites 與 trips'; } };
  if($('bImport')) $('bImport').onclick = () => apply($('bJson').value);
  if($('bFile')) $('bFile').onchange = e => { const file = e.target.files[0]; if(!file) return; file.text().then(apply); };
}

/* ---------- boot ---------- */
if(M3){
  M3.on('pin', id => { if(ui.picking) return; ui.siteSel = id; ui.focusReq = id; render(); });
  M3.on('pick', (x, y, id, name) => { if(!ui.picking || !ui.form) return; const prj = GEO.proj[id==='W'||id==='Z' ? id : 'main']; const [lng, lat] = invWith(prj, x, y);
    ui.form.coords = lat.toFixed(5)+', '+lng.toFixed(5); ui.form.county = name; ui.picking = false; render(); });
}
if(supaCfg() && !hasData(S)){ applyView(pickView(cachedUid())); }   // 先用快取畫面，雲端回來再更新
else if(!hasData(S)){ const l = lsGet('guest'); if(hasData(l)) S = l; }
render();
cloudInit();
(async () => {
  try{
    art = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
  }catch(e){ art = null; }
  canPublish = !!(art && art.publish);
  if(!canPublish && !sb.cfg) setStatus('目前只存在這個瀏覽器（此檢視無法儲存到網站）', true);
})();
})();
</script>
</body>
</html>
