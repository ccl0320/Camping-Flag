name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Prepare web bundle (inject build number)
        working-directory: android-app
        run: |
          mkdir -p www
          # 只替換第一個 </head>（程式碼字串裡也有 </head>，不能動）
          sed "0,/<\/head>/s##<script>window.__APP_BUILD__=${BUILD};</script></head>#" ../index.html > www/index.html
          n=$(grep -o "__APP_BUILD__=${BUILD}" www/index.html | wc -l)
          echo "injected: $n"; test "$n" -eq 1
          node -e "const h=require('fs').readFileSync('www/index.html','utf8');const m=[...h.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)];let bad=0;for(const s of m){if(/json/.test(s[0].slice(0,60)))continue;try{new Function(s[1])}catch(e){bad++;console.error(e.message)}}console.log('scripts ok:',m.length-bad,'bad:',bad);process.exit(bad?1:0)"

      - name: Create Capacitor Android project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#E8DEC6' --splashBackgroundColor '#F4EFE7' || echo "::warning::icon generation skipped"
          npx cap sync android

      - name: Set version and signing key
        working-directory: android-app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD}/; s/versionName \"[^\"]*\"/versionName \"1.0.${BUILD}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # 固定簽章：每一版都用 repo 裡同一把金鑰，才能直接覆蓋安裝
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  stable {
                      storeFile file("../../signing.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.stable }
                  release { signingConfig signingConfigs.stable; minifyEnabled false }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # 簽章必須是固定金鑰（SHA-256 6e676e6d…），否則不發布
          grep -qi "6e676e6d66a45054173f35d69122a1faeee2ca0b229c9537a7f2976fd27acf96" certs.txt
          cp "$APK" "$GITHUB_WORKSPACE/camping-flag.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: camping-flag-apk-v${{ github.run_number }}
          path: camping-flag.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 露營足跡 App v${{ github.run_number }}
          make_latest: true
          files: camping-flag.apk
          body: |
            ## 安裝
            - 用手機點下方 **camping-flag.apk** 下載，打開後選「安裝」。
            - 第一次安裝需允許瀏覽器「安裝不明來源的應用程式」。
            - 之後 App 會自動檢查更新，有新版會跳出提示。

            ## 這一版
            - 建置自 ${{ github.sha }}
